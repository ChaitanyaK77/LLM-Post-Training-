# A100 80GB configuration
# Can use vLLM colocate for faster GRPO generation and larger sequences

model:
  name: Qwen/Qwen3-8B
  quantization: nf4                 # still use QLoRA; could do bf16 full for SFT
  compute_dtype: bfloat16
  double_quant: true
  attn_impl: flash_attention_2      # faster on 80GB

lora:
  r: 32                             # higher rank viable on 80GB
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

sft:
  max_seq_length: 4096
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4    # effective batch = 16
  num_train_epochs: 1
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  optim: paged_adamw_8bit
  bf16: true
  gradient_checkpointing: true
  packing: true

grpo:
  num_generations: 8                # more generations = better gradient estimate
  max_prompt_length: 512
  max_completion_length: 1024
  temperature: 0.8
  top_p: 0.95
  beta: 0.04
  use_vllm: true
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  max_steps: 1000
  optim: paged_adamw_8bit
  bf16: true
  gradient_checkpointing: true

dpo:
  beta: 0.1
  max_length: 4096
  max_prompt_length: 512
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-5
  num_train_epochs: 1
  optim: paged_adamw_8bit
