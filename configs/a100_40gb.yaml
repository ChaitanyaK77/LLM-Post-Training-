# A100 40GB configuration
# Safe defaults that fit within 40GB with QLoRA

model:
  name: Qwen/Qwen3-8B
  fallback: Qwen/Qwen3-4B          # use if 8B still OOM
  quantization: nf4
  compute_dtype: bfloat16
  double_quant: true
  attn_impl: sdpa                   # use flash_attention_2 if installed

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

sft:
  max_seq_length: 2048
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8    # effective batch = 16
  num_train_epochs: 1
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  optim: paged_adamw_8bit
  bf16: true
  gradient_checkpointing: true
  packing: true

grpo:
  num_generations: 4
  max_prompt_length: 512
  max_completion_length: 768
  temperature: 0.8
  top_p: 0.95
  beta: 0.04
  use_vllm: false                   # disable on 40GB to avoid OOM
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 5.0e-6
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  max_steps: 500
  optim: paged_adamw_8bit
  bf16: true
  gradient_checkpointing: true

dpo:
  beta: 0.1
  max_length: 2048
  max_prompt_length: 512
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-5
  num_train_epochs: 1
  optim: paged_adamw_8bit
